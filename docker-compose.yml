services:
  swing-trade-mcp:
    image: registry.localdomain:5000/swing-trade-mcp:latest
    container_name: swing-trade-mcp
    restart: unless-stopped
    # No `ports:` published — this MCP server has no authentication, so it
    # only needs to be reachable by other containers on this compose network
    # (as http://swing-trade-mcp:8000), never exposed to the host/LAN.
    environment:
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-swing-trade-mcp}
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8000"
      FASTMCP_TRANSPORT: streamable-http
      # Cache lives on a named volume so the 12h yfinance cache survives
      # container recreates (e.g. Watchtower pulling a new :latest).
      CACHE_DB_PATH: /data/cache.db
    volumes:
      - swing-trade-mcp-data:/data
    labels:
      # Picked up by Watchtower for auto-redeploy on new :latest pushes.
      - "com.centurylinklabs.watchtower.enable=true"
    # Declared explicitly (not just relying on the image's Dockerfile
    # HEALTHCHECK) so `docker compose ps` / static scanners see it directly.
    # Uses stdlib urllib instead of curl/wget — no extra binary required.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  swing-trade-mcp-data:
