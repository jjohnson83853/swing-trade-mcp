name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."registry.localdomain:5000"]
              http = true
              insecure = true
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.localdomain:5000 -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker buildx build --push \
            -t registry.localdomain:5000/swing-trade-mcp:latest \
            -t registry.localdomain:5000/swing-trade-mcp:${{ github.sha }} \
            .
